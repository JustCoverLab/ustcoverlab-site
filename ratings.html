<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power Ratings Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one tall ranked board per sport, bars diverging from a center "average team" line, with tier bands and search on top. */
:root{
  --bg:#EEF1EE; --panel:#FFFFFF; --ink:#13201A; --muted:#5B6A62; --line:#D3DBD5;
  --accent:#17624A; --accent-ink:#FFFFFF; --soft:#E3EEE8; --pos:#2A78D6; --neg:#E34948; --amber:#A8670F; --amber-bg:#FBF0DA;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --panel:#16201B; --ink:#E6EEE9; --muted:#97A89E; --line:#2A3831;
  --accent:#3FAE82; --accent-ink:#04120C; --soft:#1C2D25; --pos:#3987E5; --neg:#E66767; --amber:#E7B45A; --amber-bg:#3A2B10; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1512; --panel:#16201B; --ink:#E6EEE9; --muted:#97A89E; --line:#2A3831;
  --accent:#3FAE82; --accent-ink:#04120C; --soft:#1C2D25; --pos:#3987E5; --neg:#E66767; --amber:#E7B45A; --amber-bg:#3A2B10; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px}
h1{font-family:var(--display);font-weight:700;font-size:32px;letter-spacing:.3px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--accent)}
.chip.warn{background:var(--amber-bg);color:var(--amber)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;position:sticky;top:0;z-index:2}
.tabs button{font:inherit;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.5px;border:0;border-radius:8px;padding:8px 6px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:grid;grid-template-columns:1fr auto;gap:10px}
input[type=search],select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.tile .v{font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.tile .s{font-size:12px;color:var(--muted)}
.board{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 12px 12px}
.axis{display:grid;grid-template-columns:44px minmax(120px,1.1fr) minmax(0,1.6fr) 52px;gap:10px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:8px 0 6px;border-bottom:1px solid var(--line);position:sticky;top:56px;background:var(--panel);z-index:1}
.axis .scale{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}
.r{display:grid;grid-template-columns:44px minmax(120px,1.1fr) minmax(0,1.6fr) 52px;gap:10px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.r .rk{font-family:var(--display);font-weight:600;font-size:18px;color:var(--muted);text-align:right}
.r .tm{font-size:14px;overflow-wrap:anywhere}
.r .tm small{display:block;font-size:11px;color:var(--amber)}
.r .pw{font-family:var(--display);font-weight:700;font-size:19px;text-align:right}
.track{position:relative;height:14px}
.track .mid{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line)}
.track .b{position:absolute;top:1px;height:12px}
.track .b.pos{background:var(--pos);border-radius:0 4px 4px 0}
.track .b.neg{background:var(--neg);border-radius:4px 0 0 4px}
.tier{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);padding:12px 0 4px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.empty{padding:24px 0;color:var(--muted);text-align:center}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}.axis,.r{grid-template-columns:34px minmax(96px,1fr) minmax(0,1fr) 44px;gap:8px}.tabs button{font-size:17px}.axis{top:52px}}
</style>
</head>
